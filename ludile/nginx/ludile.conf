# Ludilê — configuração Nginx isolada para o subdomínio do app (seção 19).
# Usada dentro do container ludile-nginx (docker/docker-compose.app.yml),
# que fica atrás do Nginx/Traefik do host — ver docs/DEPLOY.md para as duas
# formas de publicar isso na VPS (via EasyPanel/Traefik ou via este Nginx).

server {
    listen 80;
    server_name _;

    # Piloto privado (seção 27): reforça o robots.txt e os headers do Next.js.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/health {
        proxy_pass http://app:3000/api/health;
        access_log off;
    }
}
